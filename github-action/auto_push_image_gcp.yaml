name: Build and Publish Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      download_models:
        description: "Bake ONNX weights into the image"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
env:  
  # Always bake ONNX into published images. PRs skip; workflow_dispatch can set false.
  DOWNLOAD_MODELS: ${{ github.event_name == 'pull_request' && 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.download_models || 'true') }}
  REGISTRY: us-west1-docker.pkg.dev
  GCP_PROJECT_ID: Your Google project name
  GAR_REPOSITORY: GCR Repo name
  IMAGE_NAME: GCR Image name
  IMAGE: us-west1-docker.pkg.dev/Your Google project name/GCR Repo name/GCR Image name
 

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Get release tag
        run: echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV

      - name: Build and  push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
             ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          secrets: |
            github_token=${{ secrets.GIT_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
